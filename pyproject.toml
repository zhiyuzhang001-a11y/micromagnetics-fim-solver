[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boris-fim-local"
version = "0.2.0rc1"
description = "Qualified local macOS arm64 micromagnetics and offline measurements"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5"]
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYING", "NOTICE", "LICENSES/*"]

[project.optional-dependencies]
notebook = ["ipykernel==6.30.1", "ipython==9.17.1"]
