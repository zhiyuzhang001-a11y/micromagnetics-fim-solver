<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boris · 磁矩</title>
<style>
:root{color-scheme:dark;--bg:#0b1320;--panel:#101e30;--line:#2b3d54;--muted:#a4b5c9;--text:#edf3fa;--accent:#73dfcf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}main{max-width:1920px;margin:auto;padding:20px 24px 16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.02em}#runName{margin-left:14px;color:var(--muted);font-size:13px;font-weight:450}#phase{font-size:13px;color:var(--accent);text-align:right}.metrics{display:grid;grid-template-columns:1.2fr 1.1fr .85fr .85fr 1.1fr;gap:16px;padding:13px 0 15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric{min-width:0}.metric[hidden]{display:none}.metrics.static{grid-template-columns:repeat(3,minmax(0,1fr))}.key{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}.value{font-size:21px;line-height:1.3;font-weight:600;display:block;white-space:nowrap}.value small{font-size:12px;font-weight:450;color:var(--muted);margin-left:4px}.target{display:block;color:var(--muted);font-size:12px;margin-top:3px;min-height:17px}.physics{display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;padding:11px 0 15px;font-size:14px}.physics .key{display:inline;margin-right:8px}.physics .number{font-family:ui-monospace,SFMono-Regular,monospace;font-size:14px}.physics small{color:var(--muted);font-size:12px;margin-left:4px}#logTime{margin-left:auto;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.tools,.segmented{display:flex;align-items:center;gap:8px}.segmented{gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}.segmented button{border:0;border-radius:0;min-width:48px}.segmented button+button{border-left:1px solid var(--line)}button,select{font:inherit;height:36px;border:1px solid var(--line);border-radius:8px;background:#142338;color:var(--text);padding:0 13px;cursor:pointer;white-space:nowrap}button:hover,select:hover{background:#21364c}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button.active{color:#081e23;background:var(--accent);font-weight:650}button:disabled{opacity:.4;cursor:default}#notice{padding:9px 12px;margin-bottom:12px;background:#3b2a24;color:#ffd0ae;border-radius:7px;overflow-wrap:anywhere;font-size:13px}#notice[hidden]{display:none}.panels{display:flex;gap:12px}.panel{position:relative;flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.caption{position:absolute;top:14px;left:17px;font-size:18px;font-weight:650;pointer-events:none}.view{height:clamp(340px,55vh,760px);width:100%;touch-action:none}.framebar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:12px 0 8px}#frameTime{font-size:17px;font-weight:600}.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.bar{width:105px;height:8px;border-radius:3px;background:linear-gradient(90deg,#2166ac,#f7f7f7,#b2182b)}.timeline{display:flex;align-items:center;gap:10px}.timeline button{width:36px;padding:0}input[type=range]{min-width:30px;flex:1;accent-color:var(--accent);cursor:pointer}#frameCount{font-size:12px;min-width:70px;text-align:right;color:var(--muted)}.below{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:13px;color:var(--muted);font-size:12px;flex-wrap:wrap}#age{margin-left:auto}details{min-width:0}summary{cursor:pointer;padding:3px 0;color:var(--muted)}.details-row{display:flex;gap:24px;justify-content:space-between;align-items:flex-start;margin-top:7px}.config{flex:1}.help{max-width:48%}.details-content{padding:12px 0;overflow-wrap:anywhere;font-size:12px;color:var(--muted);line-height:1.8}.config-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 22px}.config-grid b{display:block;font-weight:500;color:var(--text)}#source{white-space:pre-line;overflow-wrap:anywhere}#helpText{max-width:540px}#io{margin-top:7px;font-family:ui-monospace,monospace}canvas{display:block;max-width:100%}@media(max-width:820px){main{padding:16px}.metrics{gap:10px}.value{font-size:18px}.physics{gap:12px}.physics .number{font-size:13px}#logTime{margin-left:0;width:100%}.view{height:440px}#runName{display:block;margin:2px 0 0}.config-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{padding:12px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}.value{font-size:18px}.toolbar{flex-wrap:wrap}.tools{gap:6px;flex-wrap:wrap}.segmented button{min-width:45px}.tools button,.tools select{padding:0 10px}.panels{flex-direction:column}.view{height:330px}.physics{column-gap:16px;row-gap:8px;padding-bottom:12px}.physics>span:first-child{width:100%}#logTime{width:auto;margin-left:auto}.framebar{gap:8px}#frameTime{font-size:15px}.bar{width:65px}.details-row{flex-direction:column;gap:3px}.help{max-width:100%}.below{gap:4px}#age{margin-left:0}.config-grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:flex-start}#phase{max-width:120px}}

[hidden]{display:none!important}body{font-size:15px}.toolbar{align-items:flex-start;flex-wrap:wrap}.tools{flex-wrap:wrap;justify-content:flex-end}.density-label{color:var(--muted);font-size:14px;margin-left:10px}button,select{height:38px}.metrics.initial{grid-template-columns:1fr}.notice-row{display:flex;gap:10px;align-items:flex-start}.notice-row #notice{flex:1}.notice-row button{margin-bottom:12px}.empty-state{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:17px}.details-row{display:block;margin-top:16px}.config{width:100%}.help{max-width:100%;margin-top:14px}.config>summary{font-size:17px;color:var(--text);padding:12px 0;border-top:1px solid var(--line)}.parameter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:12px 0}.parameter-section{min-width:0;background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:10px}.parameter-section h3{font-size:17px;color:var(--accent);margin:0 0 14px}.parameter-section table{width:100%;border-collapse:collapse;table-layout:auto;font-size:15px;line-height:1.65;color:var(--text)}.parameter-section th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:6px 8px 10px;border-bottom:1px solid var(--line)}.parameter-section td{padding:10px 8px;border-bottom:1px solid #213248;overflow-wrap:anywhere;vertical-align:top}.parameter-section{overflow-x:auto}.parameter-section td:not(:first-child){font-variant-numeric:tabular-nums;white-space:nowrap;overflow-wrap:normal;word-break:normal}.parameter-section th{white-space:nowrap}.parameter-section table{min-width:360px}.parameter-section td:last-child{color:var(--muted);font-size:13px}.below{gap:16px}#sampleCount{margin-right:auto}#age{margin-left:0}.physics[hidden]{display:none}.caption{font-size:17px}.view{height:clamp(360px,55vh,760px)}

</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<main><header><h1>磁矩<span id="runName">当前运行</span></h1><span id="phase">读取中</span></header>
<section class="metrics" aria-label="求解状态"><div class="metric"><span class="key" id="progressKey">求解时间</span><span class="value" id="progressValue">—</span><span class="target" id="progressTarget">—</span></div><div class="metric" id="stepsMetric"><span class="key" id="stepsKey">步数</span><span class="value" id="stepsValue">—</span><span class="target" id="stepsTarget">—</span></div><div class="metric" id="dtMetric"><span class="key">步长</span><span class="value" id="dtValue">—</span><span class="target" id="dtNote"></span></div><div class="metric"><span class="key">耗时</span><span class="value" id="elapsedValue">—</span><span class="target" id="elapsedNote">当前原生阶段</span></div><div class="metric"><span class="key">计算吞吐</span><span class="value" id="speedValue">—</span><span class="target" id="speedNote">阶段平均</span></div></section>
<div class="physics"><span><span class="key">能量</span><span class="number" id="energy">—</span><small>J</small></span><span><span class="key">残差 A</span><span class="number" id="resA">—</span><small>A/m</small></span><span><span class="key">B</span><span class="number" id="resB">—</span><small>A/m</small></span><span id="logTime">日志 —</span></div>
<div id="convergence" role="status" style="padding:8px 0;line-height:1.9;font-size:14px"></div><div class="toolbar"><div class="segmented" aria-label="子晶格"><button data-sub="A" aria-pressed="false">A</button><button data-sub="B" aria-pressed="false">B</button><button data-sub="both" class="active" aria-pressed="true">A+B</button></div><div class="tools"><select id="viewMode" aria-label="视图"><option value="3d">3D</option><option value="2d">2D XY</option></select><select id="component" aria-label="方向分量"><option value="2">mz</option><option value="0">mx</option><option value="1">my</option></select><span class="density-label">显示密度</span><select id="stride" aria-label="显示密度"><option value="1">每1格</option><option value="2">每2格</option><option value="4" selected>每4格</option><option value="8">每8格</option><option value="16">每16格</option></select><button id="latest" class="active">暂停</button><button id="refresh">刷新</button><button id="reset">复位</button></div></div>
<div class="notice-row"><div id="notice" role="status" hidden></div><button id="recover" hidden>恢复最新</button></div><div class="panels"><section class="panel" id="panelA"><span class="caption">A</span><div id="viewA" class="view"></div></section><section class="panel" id="panelB"><span class="caption">B</span><div id="viewB" class="view"></div></section></div>
<div class="framebar"><span id="frameTime">磁矩 —</span><div class="legend"><span>m<sub>z</sub> −1</span><span class="bar"></span><span>+1</span></div></div><div class="timeline"><button id="prev" aria-label="上一帧">←</button><input id="frame" type="range" min="0" max="0" value="0" aria-label="历史帧" disabled><button id="next" aria-label="下一帧">→</button><span id="frameCount">— / —</span></div>
<div class="below"><span id="sampleCount" role="status" aria-live="polite"></span><span id="mode">自动跟随</span><span id="age">输出更新 —</span></div><div class="details-row"><details class="config"><summary id="configSummary">模型参数</summary><div class="details-content parameter-grid" id="configValues"></div></details><details class="help"><summary>帮助与来源</summary><div class="details-content" id="helpText">3D：拖动旋转，滚轮缩放，右键平移；彩色坐标轴表示 +X、+Y、+Z。<br>2D：显示 XY 磁态，X 向右、Y 向上。颜色表示所选 mx/my/mz 分量，固定范围 −1 至 +1。<br>显示密度只影响观看，不改变求解网格。暂停观看、刷新和复位都不会停止或重算模拟。<br>历史帧参数只取该帧快照；没有快照会明确提示。<br><div id="source"></div><div id="io"></div></div></details></div></main><script type="module" src="./app.js"></script></html>
