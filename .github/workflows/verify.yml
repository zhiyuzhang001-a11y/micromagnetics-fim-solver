name: Public verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run full public native regression
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FULL: ${{ inputs.full || false }}
        run: python tools/ci/classify.py
  quick:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5 ipython==9.17.1 ipykernel==6.30.1
      - run: python tools/ci/public_audit.py
      - run: python tools/ci/prepare_offline.py
      - run: python tools/ci/run.py quick
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quick-reports
          path: ci-results/
          retention-days: 7
  browser:
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5
      - run: python tools/ci/public_audit.py
      - run: python tools/ci/prepare_offline.py
      - run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium
      - run: mkdir -p ci-results && node tests/test_script_viewer_identity.mjs
      - run: node tests/test_notebook_usability_viewer.cjs
        env:
          PYTHON: python
          CI_RESULTS: ci-results
      - run: node tests/test_notebook_arrow_count.cjs
        env:
          PYTHON: python
          CI_RESULTS: ci-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-reports
          path: ci-results/
          retention-days: 7
  native-full:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - run: brew install fftw mpfr gmp
      - run: python -m pip install numpy==2.3.5 ipython==9.17.1 ipykernel==6.30.1 'setuptools>=77' wheel
      - run: python tools/prepare_package.py --native-prefix "$(brew --prefix)"
      - run: python tools/build.py --out build --validation --current-sot --cap 600
      - run: python tools/build.py --out build-serial --current-sot --serial-local --cap 600
      - run: python tools/ci/run.py full
      - run: python setup.py bdist_wheel
        if: always()
      - name: Installed-wheel contract
        if: always()
        shell: bash
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/installed/bin/python" -I tools/ci/installed_fixture.py "$RUNNER_TEMP/initial.state"
          FIMRUN_C4_TEST_STATE="$RUNNER_TEMP/initial.state" "$RUNNER_TEMP/installed/bin/python" -I tools/ci/test_process.py test_installed_package --installed --out ci-results/installed-contract.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-full-reports
          path: ci-results/
          retention-days: 7
